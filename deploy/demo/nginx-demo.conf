# Reverse proxy for demo.openservicebus.net -> the demo Explorer container (127.0.0.1:5400).
#
# Install on the VPS:
#   sudo cp nginx-demo.conf /etc/nginx/sites-available/demo.openservicebus.net
#   sudo ln -s /etc/nginx/sites-available/demo.openservicebus.net /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d demo.openservicebus.net     # provisions the TLS cert + 443 block
#   sudo nginx -t && sudo systemctl reload nginx
#
# (Point a DNS A record demo.openservicebus.net -> the VPS IP first.)

server {
    listen 80;
    listen [::]:80;
    server_name demo.openservicebus.net;

    # certbot fills in the TLS + redirect blocks. Until then this serves the demo over HTTP.
    location / {
        proxy_pass http://127.0.0.1:5400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
