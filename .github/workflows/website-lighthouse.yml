name: Website Lighthouse

# Gates every website change on Google Lighthouse 13 (the same major version
# pagespeed.web.dev runs, including the Agentic Browsing category). The built site is
# audited on both routes (/ and /examples) in BOTH form factors (mobile and desktop),
# 3 runs each with median scoring, via website/scripts/lighthouse-gate.mjs. The job
# FAILS if performance, accessibility, best practices, or SEO scores below 99, or if
# Agentic Browsing is not a full pass.

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (mobile + desktop >= 99)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Lighthouse gate
        working-directory: website
        run: npm run lighthouse

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: website/.lighthouse/*.report.html
          if-no-files-found: ignore
