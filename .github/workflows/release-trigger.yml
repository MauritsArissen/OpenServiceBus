name: Release trigger

# Replaces the local release ritual:
#   git tag -a v1.8.4 -m "v1.8.4 - <summary>"
#   git push origin v1.8.4
# Actions tab -> Release trigger -> Run workflow: fill in the version and a one-line
# summary, and this tags the latest main and starts the Release pipeline for that tag.
#
# The tag is pushed with the built-in GITHUB_TOKEN, whose events deliberately never
# trigger other workflows - so the Release workflow is dispatched explicitly on the new
# tag ref as the final step (its manual path takes the version as an input).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to release, with or without the leading v (e.g. 1.8.4)"
        required: true
        type: string
      summary:
        description: "One-line summary for the tag message (e.g. apply PropertiesToModify on abandon / dead-letter / defer)"
        required: true
        type: string

permissions:
  contents: write # pushing the tag
  actions: write # dispatching the Release workflow

jobs:
  tag-and-release:
    name: Tag main & start release
    runs-on: ubuntu-latest
    steps:
      - name: Validate the version
        id: version
        env:
          RAW: ${{ inputs.version }}
        run: |
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW' is not a plain semver (expected e.g. 1.8.4)"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Always tags the tip of main, regardless of which ref the workflow was started
      # from - releases come from main, same as the local ritual did.
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Create and push the annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG - $SUMMARY"
          git push origin "$TAG"
          echo "Tagged main @ $(git rev-parse --short HEAD) as $TAG"

      - name: Start the Release workflow for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.version.outputs.tag }}" \
            -f version="${{ steps.version.outputs.version }}"
          echo "Release pipeline started for ${{ steps.version.outputs.tag }} - watch it in the Actions tab."
