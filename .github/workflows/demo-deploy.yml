name: Deploy demo

# Publishes the demo seeder image and (re)deploys the live demo at demo.openservicebus.net.
# On a release this is CALLED by release.yml (workflow_call) after the broker image is
# pushed, so the demo never redeploys before the new :latest exists. It also runs standalone
# on changes to the demo deploy files or seeder, and on demand.
#
# NOTE: this is NOT triggered by `release: published`. A Release created by release.yml uses
# the built-in GITHUB_TOKEN, and GitHub deliberately does not let GITHUB_TOKEN-created events
# start other workflows (anti-recursion) - so that trigger never fired. release.yml calls us
# directly instead.
#
# Reuses the existing repo secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (image push) and
# VPS_HOST / VPS_USER / VPS_SSH_KEY (deploy), the same ones release.yml and website-deploy
# already use.

on:
  workflow_call: # release.yml calls this after the broker image is pushed
  push:
    branches: [main]
    paths:
      - "deploy/demo/**"
      - "src/OpenServiceBus.DemoSeeder/**"
      - ".github/workflows/demo-deploy.yml"
  workflow_dispatch:

concurrency:
  group: demo-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  seeder-image:
    name: Build & push seeder image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OpenServiceBus.DemoSeeder/Dockerfile
          push: true
          tags: |
            mauritsarissen/openservicebus-demo-seeder:latest
            mauritsarissen/openservicebus-demo-seeder:${{ github.sha }}
            ghcr.io/mauritsarissen/openservicebus-demo-seeder:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: seeder-image
    environment:
      name: Demo
      url: https://demo.openservicebus.net
    steps:
      - uses: actions/checkout@v6

      - name: Copy compose to VPS
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete
          path: deploy/demo/
          remote_path: /opt/openservicebus-demo/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pull latest images & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/openservicebus-demo
            docker compose pull
            docker compose up -d
            docker image prune -f
