name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node (for Azure Functions Core Tools)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  # Cross-SDK smoke: boots the real Host once, then drives it with the Node.js SDK
  # (rhea) and the Java SDK (proton-j). The .NET SDK is covered by the main test suite,
  # so together every release is verified against all three official client stacks.
  # Each stack speaks measurably different AMQP (empty reply-link targets, differing
  # CBS/management shapes), so passing .NET alone proves very little - see issue #1.
  sdk-smoke:
    name: SDK smoke (Node.js + Java)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/sdk-smoke/node/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Host
        run: dotnet build src/OpenServiceBus.Host/OpenServiceBus.Host.csproj --configuration Release

      - name: Start Host
        run: |
          OPENSERVICEBUS_CONFIG=$GITHUB_WORKSPACE/tests/sdk-smoke/config.json \
            dotnet run --project src/OpenServiceBus.Host --no-launch-profile --configuration Release --no-build \
            > host.log 2>&1 &
          echo $! > host.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:5300/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:5300/health || { echo "Host failed to start"; cat host.log; exit 1; }
          grep "Bootstrapped queue" host.log

      - name: Node.js SDK smoke
        working-directory: tests/sdk-smoke/node
        run: |
          npm ci
          npm run smoke

      - name: Java SDK smoke
        working-directory: tests/sdk-smoke/java
        run: mvn -q --batch-mode compile exec:java

      - name: Host log on failure
        if: failure()
        run: cat host.log || true

      - name: Stop Host
        if: always()
        run: kill $(cat host.pid) 2>/dev/null || true
